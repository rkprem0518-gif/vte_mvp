[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dep-vuln-triage"
version = "1.0.0"
authors = [
    {name = "AI Assistant", email = "assistant@example.com"}
]
description = "Real-world dependency vulnerability triage environment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "openai>=1.10.0",
    "packaging>=23.0",
    "httpx>=0.25.0",
    "openenv-core>=0.1.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dep_vuln_triage*", "server*"]
